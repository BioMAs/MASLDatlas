
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: masldatlas-backend
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/app/datasets:ro
      - ./config:/app/config:ro
      - ./enrichment_sets:/app/enrichment_sets:ro
      - ./cache:/app/cache
      - ./backend/app:/app/app  # Hot reload for development - remove in production
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/config/datasets_config.json
      # IMPORTANT: Add your Vercel URL to ALLOWED_ORIGINS for CORS
      # Example: ALLOWED_ORIGINS=["https://masldatlas.vercel.app", "http://localhost:5173"]
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:5173", "http://localhost:3000"]}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - masldatlas-network

  # Redis for caching (recommended for production)
  redis:
    image: redis:7-alpine
    container_name: masldatlas-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - masldatlas-network

networks:
  masldatlas-network:
    driver: bridge

volumes:
  redis-data:
